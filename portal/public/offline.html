<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Geen verbinding | Jachtbus</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #000000;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0; max-width: 30ch; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding-inline: 1.25rem;
        background: #bd8f2e;
        color: #000000;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>Geen verbinding</h1>
    <p>Het portaal heeft internet nodig. Check je bereik en probeer het opnieuw.</p>
    <a href="/">Opnieuw proberen</a>

</html>
