name: Deploy to Bunny

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist/ to Bunny Storage
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_KEY }}
          BUNNY_ZONE: ${{ secrets.BUNNY_ZONE }}
        run: |
          cd dist
          find . -type f -print0 | while IFS= read -r -d '' file; do
            path="${file#./}"
            echo "Uploading $path"
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -X PUT "https://storage.bunnycdn.com/$BUNNY_ZONE/$path" \
              -H "AccessKey: $BUNNY_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" > /dev/null
          done

      - name: Purge Bunny cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE: ${{ secrets.BUNNY_PULLZONE }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.bunny.net/pullzone/$BUNNY_PULLZONE/purgeCache" \
            -H "AccessKey: $BUNNY_API_KEY" \
            -H "Content-Length: 0"
