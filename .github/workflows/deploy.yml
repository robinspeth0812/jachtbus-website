name: Deploy to Bunny

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload dist/ to Bunny Storage
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_KEY }}
          BUNNY_ZONE: ${{ secrets.BUNNY_ZONE }}
        run: |
          set -euo pipefail
          cd dist
          find . -type f -print0 | while IFS= read -r -d '' file; do
            path="${file#./}"
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X PUT \
              -H "AccessKey: $BUNNY_KEY" \
              --data-binary "@$file" \
              "https://storage.bunnycdn.com/$BUNNY_ZONE/$path")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Upload failed for $path (HTTP $status)" >&2
              exit 1
            fi
            echo "Uploaded $path"
          done

      - name: Remove stale files from Bunny Storage
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_KEY }}
          BUNNY_ZONE: ${{ secrets.BUNNY_ZONE }}
        run: |
          set -euo pipefail

          list_remote() {
            local dir="$1"
            local json
            json=$(curl -sS -H "AccessKey: $BUNNY_KEY" \
              "https://storage.bunnycdn.com/$BUNNY_ZONE/$dir")
            jq -r '.[] | [(.IsDirectory|tostring), .ObjectName] | @tsv' <<<"$json" |
            while IFS=$'\t' read -r isdir name; do
              if [ "$isdir" = "true" ]; then
                list_remote "$dir$name/"
              else
                printf '%s\n' "$dir$name"
              fi
            done
          }

          list_remote "" | while IFS= read -r path; do
            if [ ! -f "dist/$path" ]; then
              status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X DELETE \
                -H "AccessKey: $BUNNY_KEY" \
                "https://storage.bunnycdn.com/$BUNNY_ZONE/$path")
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Delete failed for $path (HTTP $status)" >&2
                exit 1
              fi
              echo "Deleted stale $path"
            fi
          done

      - name: Purge Bunny cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE: ${{ secrets.BUNNY_PULLZONE }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULLZONE/purgeCache")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Cache purge failed (HTTP $status)" >&2
            exit 1
          fi
          echo "Cache purged"
